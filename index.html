<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Monster Battle Royale</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1117;color:#fff;font-family:Arial,sans-serif}
*{box-sizing:border-box}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.hide{display:none!important}
h1{text-align:center;font-size:clamp(34px,10vw,64px);line-height:.95;margin:0 0 12px}
button{border:0;border-radius:14px;padding:14px 20px;font-size:17px;font-weight:bold}button:disabled{opacity:.48}
.big{min-width:190px;font-size:22px;background:#fff;color:#111}
.gray{background:#303846;color:#fff}.red{background:#c83d3d;color:#fff}
#select{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
#select h2{margin:8px 0 4px;font-size:30px}.hint{opacity:.7;margin-bottom:12px}
#grid{width:min(900px,100%);display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.card{background:#1a2029;color:#fff;border:2px solid transparent;text-align:left;padding:10px;border-radius:14px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.card.sel{border-color:#fff;background:#293241}.emo{font-size:30px}.nm{font-weight:bold}.st{font-size:10px;opacity:.7;margin-top:3px}
.bottom{width:min(900px,100%);display:flex;gap:8px;padding:14px 0 4px;position:sticky;bottom:0;background:linear-gradient(transparent,#0d1117 25%)}
.bottom button{flex:1}
#arena{background:#111820}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.skillText{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.7);
font-size:clamp(25px,7vw,52px);font-weight:1000;text-align:center;opacity:0;pointer-events:none;
text-shadow:0 3px 12px #000;transition:opacity .12s,transform .35s;z-index:3;white-space:nowrap}
.skillText.show{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
#top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}
.badge{background:#000b;border-radius:12px;padding:8px 12px;font-weight:bold}
#pauseBtn{position:absolute;right:10px;top:54px;background:#000b;color:#fff}
.cover{position:absolute;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:min(390px,100%);background:#1a2029;border-radius:22px;padding:25px;text-align:center}
.box h2{margin:0 0 8px;font-size:30px}.box p{opacity:.7}
.box button{margin:4px}
</style>
</head>
<body>

<section id="home" class="screen">
<h1>MONSTER<br>BATTLE ROYALE</h1>
<div class="hint">Chạm PLAY để bắt đầu</div>
<div id="homeGuyUpgradeWrap" style="width:min(900px,100%);margin:0 0 12px;text-align:center">
  <button id="guyMenuHome" class="gray" style="width:100%;font-size:20px">🆙 NÂNG CẤP MIGHT GUY</button>
  <div id="guyUpgradeHome" style="display:none;margin-top:10px;background:#1a2029;border:2px solid #384455;border-radius:18px;padding:14px">
    <div style="font-size:25px;font-weight:900">🐯 NÂNG CẤP MIGHT GUY</div>
    <div id="guyUpgradeInfoHome" style="margin:7px 0 10px;opacity:.9"></div>
    <button id="upgradeGuyHome" class="big" style="width:min(520px,100%)">NÂNG CẤP GUY</button>
  </div>
</div>
<button id="play" class="big">PLAY</button>
</section>

<section id="select" class="screen hide">
<h2>CHỌN QUÁI VẬT</h2>
<div id="counter" class="hint">Đã chọn 0 / 10</div>
<div id="grid"></div>
<div class="bottom">
<button id="back" class="gray">LOBBY</button>
<button id="start" class="big">BATTLE</button>
</div>
</section>

<section id="arena" class="screen hide">
<canvas id="canvas"></canvas><div id="skillText" class="skillText"></div>
<div id="top"><div id="alive" class="badge">Alive: 0</div><div id="koc" class="badge">KOs: 0</div></div>
<button id="pauseBtn">Ⅱ</button>
<button id="musicBtn" style="position:absolute;right:10px;top:102px;background:#000b;color:#fff">🔊 NHẠC</button>
<audio id="bgMusic" loop preload="auto"></audio>

<div id="pauseBox" class="cover hide"><div class="box">
<h2>PAUSED</h2>
<button id="resume" class="big">RESUME</button><br>
<button id="quit" class="red">EXIT BATTLE</button>
</div></div>

<div id="confirmBox" class="cover hide"><div class="box">
<h2>THOÁT TRẬN?</h2><p>Trận đấu hiện tại sẽ bị mất.</p>
<button id="yesQuit" class="red">YES</button>
<button id="noQuit" class="gray">NO</button>
</div></div>

<div id="winBox" class="cover hide"><div class="box">
<h2 id="winName">WINNER!</h2><p id="winInfo"></p>
<button id="again" class="big">PLAY AGAIN</button>
<button id="winBack" class="gray">BACK TO LOBBY</button>
</div></div>
</section>

<script>
(function(){
"use strict";

var MONSTERS=[
["Naruto Kid","🍥",1000,16,1.7,1.0],
["Luffy Kid","🏴‍☠️",1000,17,1.65,0.9],
["Goku","🟠",1000,19,1.55,0.95],
["Gojo","🕶️",1000,20,1.7,1.0],
["Zenitsu","⚡",1000,18,1.8,1.0],
["Might Guy","🐯",1000,20,1.75,1.0]
];

function $(id){return document.getElementById(id);}
function show(id){
  ["home","select","arena"].forEach(function(x){$(x).classList.add("hide");});
  $(id).classList.remove("hide");
}
function tap(el,fn){
  var moved=false,sx=0,sy=0,justTouched=false;
  el.addEventListener("touchstart",function(e){
    justTouched=true;
    if(e.touches&&e.touches[0]){
      sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false;
    }
  },{passive:true});
  el.addEventListener("touchmove",function(e){
    if(e.touches&&e.touches[0] &&
       Math.hypot(e.touches[0].clientX-sx,e.touches[0].clientY-sy)>10)moved=true;
  },{passive:true});
  el.addEventListener("touchend",function(e){
    if(e.cancelable)e.preventDefault();
    if(!moved)fn();
    setTimeout(function(){justTouched=false;},450);
  },{passive:false});
  el.addEventListener("click",function(e){
    // Mobile browsers often synthesize a click after touchend.
    // Ignore that synthetic click so PLAY/START only fire once.
    if(justTouched)return;
    fn();
  });
}


var musicOn=true, audioCtx=null, musicGain=null, musicTimer=null, musicStep=0;
function startMusic(){
  if(!musicOn)return;
  try{
    if(!audioCtx){
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      musicGain=audioCtx.createGain();
      musicGain.gain.value=.12;
      musicGain.connect(audioCtx.destination);

      // Original in-game melody (not the copyrighted recording).
      var notes=[220,247,262,294,330,294,262,247,220,196,220,247,262,294,330,392,330,294];
      var bass=[110,123,131,147,165,147,131,123,110,98,110,123,131,147,165,196,165,147];

      musicTimer=setInterval(function(){
        if(!musicOn||!audioCtx||!musicGain)return;
        if(audioCtx.state==="suspended") audioCtx.resume();

        var now=audioCtx.currentTime;
        var n=notes[musicStep%notes.length];
        var b=bass[musicStep%bass.length];
        musicStep++;

        function tone(freq,volume,duration,type){
          var o=audioCtx.createOscillator();
          var g=audioCtx.createGain();
          o.type=type||"triangle";
          o.frequency.setValueAtTime(freq,now);
          g.gain.setValueAtTime(.0001,now);
          g.gain.exponentialRampToValueAtTime(volume,now+.025);
          g.gain.exponentialRampToValueAtTime(.0001,now+duration);
          o.connect(g); g.connect(musicGain);
          o.start(now); o.stop(now+duration+.02);
        }

        tone(n,.20,.34,"triangle");
        tone(b,.055,.42,"sine");
      },420);
    }

    // Always restore volume when turning music back on.
    musicGain.gain.value=.12;
    if(audioCtx.state==="suspended") audioCtx.resume();
  }catch(e){
    console.log("Music unavailable:",e);
  }
}
function toggleMusic(){
  musicOn=!musicOn;
  $("musicBtn").textContent=musicOn?"🔊 NHẠC":"🔇 TẮT NHẠC";
  if(musicOn){
    startMusic();
  }else if(musicGain){
    musicGain.gain.value=0;
  }
}

var selected=[];
var guyLevel=0;
var guyKills=0;
var guyTigerDamage=50;
var grid=$("grid");
function guyNextRequirement(){ return guyLevel>=8 ? 0 : 5*(guyLevel+1); }
function updateGuyUpgrade(){
  var req=guyNextRequirement();
  var info=$("guyUpgradeInfoHome"), btn=$("upgradeGuyHome");
  if(guyLevel>=8){
    info.textContent="Trú Hổ: "+guyTigerDamage+" dame • Cấp 8/8 • Đã tối đa • Tổng kill: "+guyKills;
    btn.textContent="ĐÃ ĐẠT CẤP TỐI ĐA";
    btn.disabled=true;
  }else{
    info.textContent="Trú Hổ: "+guyTigerDamage+" dame • Cấp "+guyLevel+"/8 • Kill: "+guyKills+" / "+req;
    btn.textContent="NÂNG CẤP CẤP "+(guyLevel+1)+" • CẦN "+req+" KILL";
    btn.disabled=guyKills<req;
  }
}
MONSTERS.forEach(function(m,i){
  var b=document.createElement("button");
  b.className="card";
  b.innerHTML='<div class="emo">'+m[1]+'</div><div class="nm">'+m[0]+'</div><div class="st">HP '+m[2]+' • DMG '+m[3]+'<br>SPD '+m[4]+' • CD '+m[5]+'s</div>';
  tap(b,function(){
    var pos=selected.indexOf(i);
    if(pos>=0) selected.splice(pos,1);
    else if(selected.length<10) selected.push(i);
    b.classList.toggle("sel",selected.indexOf(i)>=0);
    $("counter").textContent="Đã chọn "+selected.length+" / 10";
  });
  grid.appendChild(b);
});
updateGuyUpgrade();
tap($("guyMenuHome"),function(){
  var panel=$("guyUpgradeHome");
  panel.style.display=panel.style.display==="none"?"block":"none";
  updateGuyUpgrade();
});
tap($("upgradeGuyHome"),function(){
  var req=guyNextRequirement();
  if(guyLevel<8 && guyKills>=req){
    guyLevel++;
    guyTigerDamage+=10;
    updateGuyUpgrade();
  }
});

tap($("play"),function(){show("select");startMusic();});


tap($("musicBtn"),function(){toggleMusic();});
tap($("back"),function(){show("home");});
tap($("start"),function(){
  if(selected.length<2){$("counter").textContent="⚠️ Phải chọn ít nhất 2 quái!";return;}
  startGame();
});

var canvas=$("canvas"),ctx=canvas.getContext("2d"),fighters=[],running=false,paused=false,kos=0,last=0;

function resize(){
  var d=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  canvas.width=Math.floor(innerWidth*d);canvas.height=Math.floor(innerHeight*d);
  canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";
  ctx.setTransform(d,0,0,d,0,0);
}
addEventListener("resize",resize);resize();

function startGame(){
  show("arena");$("winBox").classList.add("hide");$("pauseBox").classList.add("hide");
  fighters=[];kos=0;
  var W=innerWidth,H=innerHeight;
  selected.forEach(function(idx,n){
    var m=MONSTERS[idx],a=n/selected.length*Math.PI*2,r=Math.min(W,H)*.33;
    fighters.push({name:m[0],icon:m[1],max:m[2],hp:m[2],dmg:m[3],spd:m[4]*55,cd:m[5],
      timer:Math.random(),skillTimer: m[0]==="Naruto Kid" ? 10 : (m[0]==="Luffy Kid" ? 5 : (m[0]==="Goku" ? 8 : (m[0]==="Might Guy" ? 2 : 0))),
      x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r,
      vx:0,vy:0,alive:true,kills:0,r:22,flash:0,kind:m[0],owner:null,
      hitLock:0,skillFlash:0,skillPulse:0,skillBusy:0,skillTarget:null,skillDir:0,skillType:"",kameHitTimer:0,
      gojoCD:m[0]==="Gojo"?10:0,gojoCharge:0,gojoDir:0,gojoFire:0,
      zenitsuCD:m[0]==="Zenitsu"?8:0,zenitsuCharge:0,zenitsuDir:0,zenitsuDash:0,zenitsuHit:false,zenitsuTrail:[],guyCD:m[0]==="Might Guy"?5:0,guyTiger:null,guyDrainTimer:0,guyLevelForBattle:m[0]==="Might Guy"?guyLevel:0});
  });
  running=true;paused=false;last=performance.now();requestAnimationFrame(loop);
}

function isSameNarutoTeam(a,b){
  if(!a||!b)return false;
  return (a.kind==="Naruto Kid" && b.owner===a) ||
         (b.kind==="Naruto Kid" && a.owner===b) ||
         (a.owner && a.owner===b.owner);
}
function canTarget(attacker,target){
  if(!target||!target.alive||target===attacker)return false;
  if(isSameNarutoTeam(attacker,target))return false;
  return true;
}
function skillTargetFor(f){
  var t=null,best=Infinity;
  fighters.forEach(function(e){
    if(!canTarget(f,e))return;
    var d=Math.hypot(e.x-f.x,e.y-f.y);
    if(d<best){best=d;t=e;}
  });
  return t;
}
function beginSkill(f){
  if(!f.alive||f.skillTimer>0||f.skillBusy>0)return;
  if(f.kind!=="Luffy Kid"&&f.kind!=="Goku")return;
  var t=skillTargetFor(f);if(!t)return;
  f.skillTarget=t;f.skillDir=Math.atan2(t.y-f.y,t.x-f.x);
  f.skillBusy=f.kind==="Goku"?1.4:.48;f.skillTimer=f.kind==="Goku"?8:5;
  f.skillType=f.kind==="Goku"?"kame":"fist";f.kameHitTimer=0;f.vx=0;f.vy=0;
}
function tickSkill(f,dt){
  if(f.skillTimer>0)f.skillTimer=Math.max(0,f.skillTimer-dt);
  if(f.skillBusy<=0)return false;
  f.skillBusy=Math.max(0,f.skillBusy-dt);f.vx=0;f.vy=0;
  if(f.skillBusy<=0&&f.skillTarget&&f.skillTarget.alive){
    var t=f.skillTarget,dx=Math.cos(f.skillDir),dy=Math.sin(f.skillDir);
    if(f.skillType==="fist"){
      if(Math.hypot(t.x-f.x,t.y-f.y)<220){t.hp-=f.dmg*2;t.flash=.16;t.vx+=dx*480;t.vy+=dy*480;}
    }else{
      fighters.forEach(function(e){
        if(!e.alive||e===f||e.owner===f)return;
        var ex=e.x-f.x,ey=e.y-f.y,along=ex*dx+ey*dy,side=Math.abs(ex*dy-ey*dx);
        if(along>15&&along<330&&side<30){e.hp-=f.dmg*1.5;e.flash=.16;e.vx+=dx*360;e.vy+=dy*360;}
      });
    }
    f.skillTarget=null;
  }
  return true;
}

function loop(t){
  if(!running)return;
  var dt=Math.min(.03,Math.max(0,(t-last)/1000));last=t;
  if(!paused)update(dt);
  draw();
  requestAnimationFrame(loop);
}
function update(dt){
  var alive=fighters.filter(function(f){return f.alive;});
  $("alive").textContent="Alive: "+alive.length;$("koc").textContent="KOs: "+kos;

  alive.forEach(function(f){
    f.timer=Math.max(0,f.timer-dt);
    f.skillTimer=Math.max(0,f.skillTimer-dt);
    f.hitLock=Math.max(0,f.hitLock-dt);
    f.flash=Math.max(0,f.flash-dt);
    f.skillFlash=Math.max(0,f.skillFlash-dt);f.skillPulse=Math.max(0,f.skillPulse-dt);
    if(f.kind==="Might Guy" && !f.owner){
      // Chỉ Lv8 mới có hiệu ứng mất máu khi HP xuống dưới 30%.
      // Lv0-Lv7 tuyệt đối không bị trừ máu bởi cơ chế khí.
      if((f.guyLevelForBattle||0)>=8 && f.hp/f.max<.30){
        f.guyDrainTimer=Math.max(0,f.guyDrainTimer-dt);
        if(f.guyDrainTimer<=0){
          f.hp-=5;
          f.guyDrainTimer=.20;
          f.flash=.05;
          if(f.hp<=0){f.hp=0;f.alive=false;}
        }
      }else{
        f.guyDrainTimer=0;
      }
    }
    if(f.kind==="Zenitsu" && f.zenitsuTrail){
      f.zenitsuTrail.forEach(function(tr){tr.life-=dt;});
      f.zenitsuTrail=f.zenitsuTrail.filter(function(tr){return tr.life>0;});
    }

    // Naruto Kid: create two short-lived shadow clones every 10 seconds.
    if(f.kind==="Naruto Kid" && !f.owner && f.skillTimer<=0){
      spawnClone(f,-1);
      spawnClone(f,1);
      f.skillTimer=10;
      f.skillFlash=.8;
      f.skillPulse=.8;
      showSkillText("🍥 SHADOW CLONE!");
    }

    // Goku: use the ORIGINAL Kamehameha skill and 8-second cooldown.
    if(f.kind==="Goku" && !f.owner && f.skillTimer<=0 && f.skillBusy<=0){
      beginSkill(f);
      if(f.skillBusy>0){
        f.skillFlash=.8;
        f.skillPulse=.8;
        showSkillText("🟠 KAMEHAMEHA!");
      }
    }
    if(f.kind==="Goku" && f.skillBusy>0){
      tickSkill(f,dt);
      // Kamehameha is a persistent beam: enemies inside it take 2 damage repeatedly.
      f.kameHitTimer=Math.max(0,f.kameHitTimer-dt);
      if(f.skillType==="kame" && f.kameHitTimer<=0){
        var kdx=Math.cos(f.skillDir),kdy=Math.sin(f.skillDir);
        fighters.forEach(function(e){
          if(!e.alive||e===f||e.owner===f)return;
          var ex=e.x-f.x,ey=e.y-f.y,along=ex*kdx+ey*kdy,side=Math.abs(ex*kdy-ey*kdx);
          if(along>15&&along<330&&side<30){
            e.hp-=2;e.flash=.08;e.vx+=kdx*35;e.vy+=kdy*35;
            if(e.hp<=0){e.hp=0;e.alive=false;f.kills++;kos++;}
          }
        });
        f.kameHitTimer=.15;
      }
    }

    // Luffy Kid: Gum-Gum Pistol, ranged hit every 5 seconds.
    if(f.kind==="Luffy Kid" && !f.owner && f.skillTimer<=0){
      useLuffyPistol(f,alive);
      f.skillTimer=5;
      f.skillFlash=.8;
      f.skillPulse=.8;
      showSkillText("🏴‍☠️ GUM-GUM PISTOL!");
    }

    // Gojo: 10s cooldown. When ready, blue + red charge and merge into a
    // slightly larger purple sphere, then fire it in the stored direction.
    if(f.kind==="Gojo" && !f.owner){
      f.gojoCD=Math.max(0,f.gojoCD-dt);
      if(f.gojoCharge>0){
        f.gojoCharge=Math.max(0,f.gojoCharge-dt);
        f.vx=0; f.vy=0;
        if(f.gojoCharge<=0){
          fireGojoPurple(f);
          f.skillFlash=.9;
          f.skillPulse=.9;
          showSkillText("🟣 HƯ THỨC TỬ!");
        }
      } else if(f.gojoFire>0){
        f.gojoFire=Math.max(0,f.gojoFire-dt);
        f.vx=0; f.vy=0;
      } else if(f.gojoCD<=0){
        var gt=skillTargetFor(f);
        if(gt){
          f.gojoDir=Math.atan2(gt.y-f.y,gt.x-f.x);
          f.gojoCharge=3.3;
          f.gojoCD=10;
          f.vx=0; f.vy=0;
          showSkillText("🔵 + 🔴  →  🟣");
        }
      }
    }
    if(f.kind==="Gojo" && !f.owner) tickGojoProjectile(f,dt);

    // Might Guy: Trú Hổ. Fires a white tiger head toward the nearest enemy every 5s.
    if(f.kind==="Might Guy" && !f.owner){
      f.guyCD=Math.max(0,f.guyCD-dt);
      if(f.guyTiger){
        var tg=f.guyTiger;
        tg.x+=tg.vx*dt;tg.y+=tg.vy*dt;tg.life-=dt;
        // Chỉ thêm cơ chế mới ở Lv8 + dưới 30% HP; không thay đổi logic Lv0-Lv7.
        if(tg.redLunge){ f.vx=tg.vx; f.vy=tg.vy; }
        fighters.forEach(function(e){
          if(tg.hit||!e.alive||e===f||e.owner===f)return;
          if(Math.hypot(e.x-tg.x,e.y-tg.y)<e.r+tg.r){
            e.hp-=tg.damage*guyDamageMultiplier(f);e.flash=.2;e.vx+=tg.vx*.18;e.vy+=tg.vy*.18;tg.hit=true;
            if(e.hp<=0){e.hp=0;e.alive=false;f.kills++;kos++;if(f.kind==="Might Guy"&&!f.owner){guyKills++;updateGuyUpgrade();}}
          }
        });
        if(tg.hit||tg.life<=0||tg.x<-120||tg.x>innerWidth+120||tg.y<-120||tg.y>innerHeight+120){
          f.guyTiger=null;
          if(tg.redLunge){ f.vx=0; f.vy=0; }
        }
      }
      if(f.guyCD<=0 && !f.guyTiger){
        var gt=skillTargetFor(f);
        if(gt){
          var gdx=gt.x-f.x,gdy=gt.y-f.y,gd=Math.hypot(gdx,gdy)||1;
          var redLunge=((f.guyLevelForBattle||0)>=8 && f.hp/f.max<.30);
          f.guyTiger={x:f.x+gdx/gd*42,y:f.y+gdy/gd*42,vx:gdx/gd*500,vy:gdy/gd*500,life:.9,r:32,damage:guyTigerDamage,hit:false,redLunge:redLunge};
          if(redLunge){ f.vx=f.guyTiger.vx; f.vy=f.guyTiger.vy; }
          f.guyCD=5;f.skillFlash=.7;f.skillPulse=.7;showSkillText("🐯 TRÚ HỔ!");
        }
      }
    }

    // Zenitsu: Thunderclap and Flash. 3s charge, then a fast sword dash through the target.
if(f.kind==="Zenitsu" && !f.owner){
      f.zenitsuCD=Math.max(0,f.zenitsuCD-dt);
      if(f.zenitsuCharge>0){
        f.zenitsuCharge=Math.max(0,f.zenitsuCharge-dt);
        f.vx=0; f.vy=0;
        if(f.zenitsuCharge<=0){
          var zt=skillTargetFor(f);
          if(zt){
            f.zenitsuDir=Math.atan2(zt.y-f.y,zt.x-f.x);
            f.zenitsuDash=.48;
            f.zenitsuHit=false;
            f.zenitsuTrail=[];
            f.zenitsuCD=8;
            f.skillFlash=.9;
            f.skillPulse=.9;
            showSkillText("⚡ PHÍCH LỊCH NHẤT THIỂM!");
          }else{
            f.zenitsuCD=1;
          }
        }
      } else if(f.zenitsuDash>0){
        f.zenitsuDash=Math.max(0,f.zenitsuDash-dt);
        var zd=1-Math.max(0,Math.min(1,f.zenitsuDash/.48));
        var zdx=Math.cos(f.zenitsuDir),zdy=Math.sin(f.zenitsuDir);
        f.vx=zdx*1050; f.vy=zdy*1050;
        f.zenitsuTrail.push({x:f.x,y:f.y,life:.34});
        if(f.zenitsuTrail.length>18)f.zenitsuTrail.shift();

        // Slash through an opponent, not stopping on contact.
        fighters.forEach(function(e){
          if(f.zenitsuHit||!e.alive||e===f||e.owner===f)return;
          var ex=e.x-f.x,ey=e.y-f.y;
          var along=ex*zdx+ey*zdy,side=Math.abs(ex*zdy-ey*zdx);
          if(Math.abs(along)<48 && side<42){
            e.hp-=f.dmg*3.0;
            e.flash=.25;
            e.vx+=zdx*700; e.vy+=zdy*700;
            f.zenitsuHit=true;
            if(e.hp<=0){e.hp=0;e.alive=false;f.kills++;kos++;}
          }
        });
        if(f.zenitsuDash<=0){f.vx=0;f.vy=0;}
      } else if(f.zenitsuCD<=0){
        var zt0=skillTargetFor(f);
        if(zt0){
          f.zenitsuDir=Math.atan2(zt0.y-f.y,zt0.x-f.x);
          f.zenitsuCharge=3;
          f.vx=0;f.vy=0;
          showSkillText("⚡ TỤ LỰC 3s...");
        }
      }
    }

    if(f.kind==="Zenitsu" && !f.owner && f.zenitsuDash<=0 && f.zenitsuCharge<=0 && f.zenitsuCD<=0){
      f.vx=0;f.vy=0;
    }

    if(f.kind==="Zenitsu" && !f.owner && (f.zenitsuCharge>0 || f.zenitsuDash>0)){
      // Locked in place while charging or dashing.
    } else if(f.hitLock<=0 && !(f.kind==="Might Guy" && !f.owner && f.guyTiger && f.guyTiger.redLunge)){
      var target=null,best=Infinity;
      alive.forEach(function(e){
        if(!canTarget(f,e))return;
        var dx=e.x-f.x,dy=e.y-f.y,d=dx*dx+dy*dy;
        if(d<best){best=d;target=e;}
      });
      if(target){
        var dx=target.x-f.x,dy=target.y-f.y,d=Math.hypot(dx,dy)||1;
        var wantX=dx/d*f.spd,wantY=dy/d*f.spd;
        f.vx+=(wantX-f.vx)*Math.min(1,dt*7);
        f.vy+=(wantY-f.vy)*Math.min(1,dt*7);
      }
    }else{
      // Friction during the brief knockback lock.
      f.vx*=Math.pow(.12,dt);
      f.vy*=Math.pow(.12,dt);
    }

    f.x+=f.vx*dt;f.y+=f.vy*dt;
    f.x=Math.max(f.r+12,Math.min(innerWidth-f.r-12,f.x));
    f.y=Math.max(80+f.r,Math.min(innerHeight-f.r-12,f.y));
  });

  // Hard physical separation + one hit per contact.
  // This is intentionally stronger than the old version so characters cannot sit on top of each other.
  for(var i=0;i<fighters.length;i++)for(var j=i+1;j<fighters.length;j++){
    var a=fighters[i],b=fighters[j];
    if(!a.alive||!b.alive)continue;
    if(a.owner && a.owner===b.owner)continue;

    var dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,min=a.r+b.r+2;
    if(d<min){
      var nx=dx/d,ny=dy/d,o=min-d;

      // Move them physically apart, even if they have zero velocity.
      a.x-=nx*o*.55;a.y-=ny*o*.55;
      b.x+=nx*o*.55;b.y+=ny*o*.55;

      // Always add an outward impulse so they don't get sucked back together.
      var impulse=220;
      a.vx-=nx*impulse;a.vy-=ny*impulse;
      b.vx+=nx*impulse;b.vy+=ny*impulse;

      // Same Naruto team (owner + clones) must NEVER attack each other.
      var sameNarutoTeam = (a.owner && a.owner===b.owner) ||
                           (a.owner===b && b.kind==="Naruto Kid") ||
                           (b.owner===a && a.kind==="Naruto Kid");
      // Only deal damage if attack cooldown is ready.
      if(!sameNarutoTeam && a.timer<=0 && a.hitLock<=0)damage(a,b,nx,ny);
      if(!sameNarutoTeam && b.timer<=0 && b.hitLock<=0 && b.alive)damage(b,a,-nx,-ny);
    }
  }

  // Remove expired Naruto clones.
  fighters.forEach(function(f){
    if(f.alive && f.owner && f.life!==undefined){
      f.life-=dt;
      if(f.life<=0){f.alive=false;}
    }
  });

  alive=fighters.filter(function(f){return f.alive;});
  if(alive.length<=1){
    running=false;var w=alive[0];
    $("winName").textContent=w?w.icon+" "+w.name+" WINS!":"DRAW!";
    $("winInfo").textContent=w?"KOs: "+w.kills+" • HP: "+Math.ceil(w.hp)+" / "+w.max:"Everyone was knocked out.";
    $("winBox").classList.remove("hide");
  }
}

function tickGojoProjectile(f,dt){

function useLuffyPistol(user,alive){
  var target=null,best=Infinity;
  alive.forEach(function(e){

    var dx=e.x-user.x,dy=e.y-user.y,d=Math.hypot(dx,dy);
    if(d<best && d<260){best=d;target=e;}
  });
  if(!target)return;

function guyDamageMultiplier(f){
  if(!f || f.kind!=="Might Guy") return 1;
  var lvl=f.guyLevelForBattle||0;
  var ratio=f.hp/f.max;

  // Lv0: từ đầu đến cuối không có khí và không tăng damage.
  if(lvl<=0) return 1;

  // Lv1-5: chỉ có mốc 90% HP.
  if(lvl<=5) return ratio<=.90 ? 1.10 : 1;

  // Lv6: 90% +10%, 70% chuyển khí xanh lá +20%.
  if(lvl===6){
    if(ratio<=.70) return 1.20;
    if(ratio<=.90) return 1.10;
    return 1;
  }

  // Lv7: 90% +10%, 70% +20%, 50% chuyển khí xanh lam +30%.
  if(lvl===7){
    if(ratio<=.50) return 1.30;
    if(ratio<=.70) return 1.20;
    if(ratio<=.90) return 1.10;
    return 1;
  }

  // Lv8: thêm mốc 30% -> khí đỏ +50%.
  if(ratio<=.30) return 1.50;
  if(ratio<=.50) return 1.30;
  if(ratio<=.70) return 1.20;
  if(ratio<=.90) return 1.10;
  return 1;
}
function damage(att,vic,nx,ny){
  var dealt=att.dmg*guyDamageMultiplier(att);
  vic.hp-=dealt;
  att.timer=att.cd;
  att.hitLock=.10;
  vic.flash=.12;
  vic.hitLock=.22;
  var kb=Math.max(260,att.dmg*13);
  vic.vx+=nx*kb;vic.vy+=ny*kb;
  // Extra immediate positional push prevents overlap on slow devices.
  vic.x+=nx*5;vic.y+=ny*5;
  if(vic.hp<=0){vic.hp=0;vic.alive=false;att.kills++;kos++;if(att.kind==="Might Guy"&&!att.owner){guyKills++;updateGuyUpgrade();}}
}
function drawGuyAura(f){
  if(!f || f.kind!=="Might Guy" || f.max<=0)return;

  var lvl=f.guyLevelForBattle||0;
  var ratio=f.hp/f.max;

  // Lv0: hoàn toàn không có khí.
  if(lvl<=0 || ratio>.90)return;

  // Chọn đúng màu theo CẤP + MỐC HP đã mở.
  // Lv1-5: <=90% chỉ khí nóng.
  // Lv6: <=90% nóng, <=70% xanh lá.
  // Lv7: <=90% nóng, <=70% xanh lá, <=50% xanh lam.
  // Lv8: thêm <=30% khí đỏ.
  var type="hot";
  if(lvl>=6 && ratio<=.70) type="green";
  if(lvl>=7 && ratio<=.50) type="blue";
  if(lvl>=8 && ratio<=.30) type="red";

  var color=type==="hot"?"#ffb14e":(type==="green"?"#39ff88":(type==="blue"?"#35a9ff":"#ff3030"));
  var threshold=type==="hot"?.90:(type==="green"?.70:(type==="blue"?.50:.30));
  var power=Math.max(.45,Math.min(1.45,(threshold-ratio)/Math.max(.01,threshold)+.45));

  ctx.save();
  ctx.globalCompositeOperation="lighter";
  for(var i=0;i<10;i++){
    var a=(i/10)*Math.PI*2+performance.now()/900*(i%2?1:-1);
    var rr=30+(i%4)*5;
    var x=f.x+Math.cos(a)*rr,y=f.y+Math.sin(a)*rr;
    ctx.globalAlpha=.18*power;
    ctx.strokeStyle=color;ctx.lineWidth=2+(i%3);
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.quadraticCurveTo(x+Math.cos(a+.8)*9,y+Math.sin(a+.8)*9,x+Math.cos(a)*14,y+Math.sin(a)*14);
    ctx.stroke();
  }
  ctx.globalAlpha=.20*power;ctx.fillStyle=color;ctx.shadowBlur=24;ctx.shadowColor=color;
  ctx.beginPath();ctx.arc(f.x,f.y,31+7*power,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.restore();
}

      else ctx.fillText("Hư Thức Tử CD: "+Math.ceil(f.gojoCD)+"s",f.x,f.y+63);
    }
    if(f.kind==="Might Guy" && !f.owner){
      var gm=guyDamageMultiplier(f),gr=Math.round((f.hp/f.max)*100);
      ctx.fillStyle="#fff";
      ctx.fillText("Trú Hổ CD: "+Math.ceil(f.guyCD)+"s • LV "+f.guyLevelForBattle+" • "+Math.round((gm-1)*100)+"% DMG",f.x,f.y+63);
    }
    if(f.kind==="Might Guy" && !f.owner && f.guyTiger){
  var tg=f.guyTiger,ta=Math.atan2(tg.vy,tg.vx);
  ctx.save();ctx.translate(tg.x,tg.y);ctx.rotate(ta);ctx.globalAlpha=Math.min(1,tg.life*2);
  ctx.shadowBlur=18;ctx.shadowColor="#fff";ctx.fillStyle="#fff";ctx.strokeStyle="#d7dce4";ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(0,0,28,20,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-20,-14);ctx.lineTo(-34,-27);ctx.lineTo(-25,-5);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-20,14);ctx.lineTo(-34,27);ctx.lineTo(-25,5);ctx.fill();ctx.stroke();
  ctx.fillStyle="#111";ctx.beginPath();ctx.arc(10,-7,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(10,7,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.moveTo(28,0);ctx.lineTo(42,-7);ctx.lineTo(42,7);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.restore();
}

if(f.kind==="Zenitsu" && !f.owner){
      ctx.fillStyle="#fff";
      if(f.zenitsuCharge>0) ctx.fillText("Phích Lịch Nhất Thiểm: TỤ "+Math.ceil(f.zenitsuCharge)+"s",f.x,f.y+63);
      else if(f.zenitsuDash>0) ctx.fillText("Phích Lịch Nhất Thiểm: ⚡",f.x,f.y+63);
      else ctx.fillText("Phích Lịch Nhất Thiểm CD: "+Math.ceil(f.zenitsuCD)+"s",f.x,f.y+63);
    }
    if(f.skillFlash>0){
      var pulse=1+(0.55-f.skillFlash)*2.2;
      ctx.beginPath();ctx.arc(f.x,f.y,f.r+10+pulse*18,0,Math.PI*2);
      ctx.strokeStyle="#fff";ctx.lineWidth=5;ctx.globalAlpha=Math.min(1,f.skillFlash*1.5);ctx.stroke();
      ctx.globalAlpha=1;
    }
    if(f.kind==="Luffy Kid" && f.skillFlash>0){
      ctx.save();
      ctx.translate(f.x,f.y);
      ctx.rotate(f.skillDir||0);
      var skin="#f2c6a0", skinDark="#8f5f43", skinLight="#e8b58e";
      ctx.lineCap="round";ctx.lineJoin="round";

      // Long rubber arm.
      ctx.strokeStyle=skin;ctx.lineWidth=22;
      ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(86,0);ctx.stroke();
      ctx.strokeStyle=skinDark;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(86,0);ctx.stroke();

      // Skin-colored fist.
      ctx.fillStyle=skin;ctx.strokeStyle=skinDark;ctx.lineWidth=2;
      ctx.beginPath();
      ctx.roundRect(78,-16,38,32,10);
      ctx.fill();ctx.stroke();

      // Knuckles/fingers.
      ctx.fillStyle=skinLight;
      ctx.fillRect(84,-11,7,22);
      ctx.fillRect(93,-11,7,22);
      ctx.fillRect(102,-10,7,20);

      // Thumb.
      ctx.fillStyle=skin;
      ctx.beginPath();ctx.arc(113,5,9,0,Math.PI*2);ctx.fill();ctx.stroke();

      ctx.restore();
    }
  });
}

tap($("pauseBtn"),function(){if(running){paused=true;$("pauseBox").classList.remove("hide");}});
tap($("resume"),function(){paused=false;$("pauseBox").classList.add("hide");});
tap($("quit"),function(){$("pauseBox").classList.add("hide");$("confirmBox").classList.remove("hide");});
tap($("noQuit"),function(){$("confirmBox").classList.add("hide");$("pauseBox").classList.remove("hide");});
tap($("yesQuit"),function(){running=false;paused=false;$("confirmBox").classList.add("hide");show("select");});
tap($("again"),function(){startGame();});
tap($("winBack"),function(){running=false;show("home");});

})();
</script>
</body>
