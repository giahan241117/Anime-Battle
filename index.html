<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Monster Battle Royale</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1117;color:#fff;font-family:Arial,sans-serif}
*{box-sizing:border-box}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.hide{display:none!important}
h1{text-align:center;font-size:clamp(34px,10vw,64px);line-height:.95;margin:0 0 12px}
button{border:0;border-radius:14px;padding:14px 20px;font-size:17px;font-weight:bold}button:disabled{opacity:.48}
.big{min-width:190px;font-size:22px;background:#fff;color:#111}
.gray{background:#303846;color:#fff}.red{background:#c83d3d;color:#fff}
#select{justify-content:flex-start;overflow:hidden;height:100%;padding:10px 10px 8px;touch-action:pan-y}
#select h2{margin:1px 0 0;font-size:clamp(19px,4.8vw,25px);flex:none}.hint{opacity:.7;margin:0 0 3px;font-size:10px;flex:none}
#grid{width:min(900px,100%);flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;align-content:start;padding:1px 0 4px}
.card{background:#1a2029;color:#fff;border:2px solid transparent;text-align:left;padding:5px 7px;border-radius:11px;touch-action:manipulation;user-select:none;-webkit-user-select:none;display:grid;grid-template-columns:36px minmax(0,1fr);grid-template-rows:auto auto;align-items:center;column-gap:6px;row-gap:1px;min-height:54px;overflow:hidden}.card.sel{border-color:#fff;background:#293241}.emo{grid-row:1 / 3;font-size:27px;width:36px;height:36px;display:flex;align-items:center;justify-content:center}.todorokiHead{width:34px;height:34px;border-radius:50%;background:#f2c6a0;position:relative;overflow:hidden;box-shadow:inset 0 -2px 0 #d79b78}.todorokiHead:before{content:"";position:absolute;left:0;top:0;width:100%;height:20px;background:linear-gradient(90deg,#d83b3b 0 50%,#4da9ff 50% 100%);border-radius:50% 50% 35% 35%}.todorokiHead:after{content:"";position:absolute;left:7px;right:7px;top:21px;height:4px;background:#222;border-radius:50%}.nm{font-weight:bold;font-size:clamp(13px,3.5vw,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.05}.st{font-size:clamp(7px,2.3vw,10px);opacity:.72;margin-top:3px;line-height:1.15}
.bottom{width:min(900px,100%);display:flex;gap:6px;padding:5px 0 1px;position:relative;flex:none;background:#0d1117;z-index:5}
.bottom button{flex:1;min-height:40px;padding:6px 8px;font-size:14px;border-radius:10px}
#arena{background:#111820}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;transform:scale(.9);transform-origin:center center}
.skillText{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.7);
font-size:clamp(25px,7vw,52px);font-weight:1000;text-align:center;opacity:0;pointer-events:none;
text-shadow:0 3px 12px #000;transition:opacity .12s,transform .35s;z-index:3;white-space:nowrap}
.skillText.show{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
#top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}
.badge{background:#000b;border-radius:12px;padding:8px 12px;font-weight:bold}
#pauseBtn{position:absolute;right:10px;top:54px;background:#000b;color:#fff}
.cover{position:absolute;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:min(390px,100%);background:#1a2029;border-radius:22px;padding:25px;text-align:center}
.box h2{margin:0 0 8px;font-size:30px}.box p{opacity:.7}
.box button{margin:4px}


.upgrade-panel{display:none;margin-top:8px;background:#151b24;border:1px solid #384455;border-radius:16px;padding:8px;width:100%;max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.upgrade-title{text-align:center;font-size:clamp(18px,4.5vw,25px);font-weight:900;margin:0 0 8px}
.upgrade-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.upgrade-card{background:#202733;border-radius:12px;padding:8px;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:5px}
.upgrade-name{font-size:clamp(14px,3.5vw,19px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;line-height:1.05}
.upgrade-info{margin:0;opacity:.88;font-size:clamp(10px,2.7vw,14px);line-height:1.15;text-align:center;min-height:31px;display:flex;align-items:center;justify-content:center}
.upgrade-btn{width:100%;padding:7px 5px;border-radius:9px;font-size:clamp(10px,2.8vw,14px);line-height:1.05;background:#fff;color:#111;min-height:34px}.reset-btn{width:100%;padding:6px 5px;border-radius:9px;font-size:clamp(9px,2.5vw,12px);line-height:1;background:#b91c1c;color:#fff;min-height:30px;border:0;font-weight:800}
@media(max-width:430px){.upgrade-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.upgrade-panel{max-height:50vh;padding:7px}.upgrade-card{padding:7px}.upgrade-name{font-size:clamp(12px,3.4vw,16px)}.upgrade-info{font-size:clamp(9px,2.5vw,12px);min-height:34px}.upgrade-btn{font-size:clamp(9px,2.6vw,12px);padding:7px 3px}}

#fpsCounter{position:fixed;left:10px;top:10px;z-index:9999;padding:4px 8px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;font:700 13px Arial,sans-serif;pointer-events:none;}
</style>
</head>
<body>
<div id="fpsCounter">FPS: --</div>

<section id="home" class="screen">
<h1>MONSTER<br>BATTLE ROYALE</h1>
<div class="hint">Chạm PLAY để bắt đầu</div>
<div id="upgradeWrapHome" style="width:min(900px,100%);margin:0 0 12px;text-align:center">
  <button id="upgradeMenuHome" class="gray" style="width:100%;font-size:20px">🆙 NÂNG CẤP NHÂN VẬT</button>
  <div id="upgradePanelHome" class="upgrade-panel">
    <div class="upgrade-title">🆙 NÂNG CẤP NHÂN VẬT</div>
    <div class="upgrade-grid">
      <div class="upgrade-card">
        <div class="upgrade-name">🐯 MIGHT GUY</div>
        <div id="guyUpgradeInfoHome" class="upgrade-info"></div>
        <button id="upgradeGuyHome" class="upgrade-btn">NÂNG CẤP</button>
        <button id="resetGuyHome" class="reset-btn">↩ RESET LV (GIỮ KILL)</button>
      </div>
      <div class="upgrade-card">
        <div class="upgrade-name">☁️ PAIN</div>
        <div id="painUpgradeInfoHome" class="upgrade-info"></div>
        <button id="upgradePainHome" class="upgrade-btn">NÂNG CẤP</button>
        <button id="resetPainHome" class="reset-btn">↩ RESET LV (GIỮ KILL)</button>
      </div>
      <div class="upgrade-card">
        <div class="upgrade-name">🔴🔵 TODOROKI</div>
        <div id="todorokiUpgradeInfoHome" class="upgrade-info"></div>
        <button id="upgradeTodorokiHome" class="upgrade-btn">NÂNG CẤP</button>
        <button id="resetTodorokiHome" class="reset-btn">↩ RESET LV (GIỮ KILL)</button>
      </div>
      <div class="upgrade-card">
        <div class="upgrade-name">🩸 POWER</div>
        <div id="powerUpgradeInfoHome" class="upgrade-info"></div>
        <button id="upgradePowerHome" class="upgrade-btn">NÂNG CẤP</button>
        <button id="resetPowerHome" class="reset-btn">↩ RESET LV (GIỮ KILL)</button>
      </div>
      <div class="upgrade-card">
        <div class="upgrade-name">🐺 MEGUMI</div>
        <div id="megumiUpgradeInfoHome" class="upgrade-info"></div>
        <button id="upgradeMegumiHome" class="upgrade-btn">NÂNG CẤP</button>
        <button id="resetMegumiHome" class="reset-btn">↩ RESET LV (GIỮ KILL)</button>
      </div>
    </div>
  </div>
</div>
<button id="play" class="big">PLAY</button>
</section>

<section id="select" class="screen hide">
<h2>CHỌN QUÁI VẬT</h2>
<div id="counter" class="hint">Đã chọn 0 / 10</div>
<div id="grid"></div>
<div class="bottom">
<button id="back" class="gray">LOBBY</button>
<button id="start" class="big">BATTLE</button>
</div>
</section>

<section id="arena" class="screen hide">
<canvas id="canvas"></canvas><div id="skillText" class="skillText"></div>
<div id="top"><div id="alive" class="badge">Alive: 0</div><div id="koc" class="badge">KOs: 0</div></div>
<button id="pauseBtn">Ⅱ</button>
<button id="musicBtn" style="position:absolute;right:10px;top:102px;background:#000b;color:#fff">🔊 NHẠC</button>
<audio id="bgMusic" loop preload="auto"></audio>

<div id="pauseBox" class="cover hide"><div class="box">
<h2>PAUSED</h2>
<button id="resume" class="big">RESUME</button><br>
<button id="quit" class="red">EXIT BATTLE</button>
</div></div>

<div id="confirmBox" class="cover hide"><div class="box">
<h2>THOÁT TRẬN?</h2><p>Trận đấu hiện tại sẽ bị mất.</p>
<button id="yesQuit" class="red">YES</button>
<button id="noQuit" class="gray">NO</button>
</div></div>

<div id="winBox" class="cover hide"><div class="box">
<h2 id="winName">WINNER!</h2><p id="winInfo"></p>
<button id="again" class="big">PLAY AGAIN</button>
<button id="winBack" class="gray">BACK TO LOBBY</button>
</div></div>
</section>

<script>
(function(){
"use strict";

var MONSTERS=[
["Naruto Kid","🍥",1000,16,1.7,1.0],
["Luffy Kid","🏴‍☠️",1000,17,1.65,0.9],
["Goku","🟠",1000,19,1.55,0.95],
["Gojo","🕶️",1000,20,1.7,1.0],
["Zenitsu","⚡",1000,18,1.8,1.0],
["Might Guy","🐯",1000,20,1.75,1.0],
["Momo Ayase","🩷",1000,22,1.7,1.0],
["Pain","👁️👁️",1000,23,1.65,1.0],
["Kusakabe Atsuya","⚔️",1000,21,1.7,1.0],
["Todoroki Shoto","👤",1000,21,1.7,1.0],
["Power","🩸",1000,22,1.75,1.0],
["Tatsumaki","🌀",1000,21,1.75,1.0],
["Megumi","🐺",1000,20,1.7,1.0]
];

function $(id){return document.getElementById(id);}
function show(id){
  ["home","select","arena"].forEach(function(x){$(x).classList.add("hide");});
  $(id).classList.remove("hide");
}
function tap(el,fn){
  var moved=false,sx=0,sy=0,justTouched=false;
  el.addEventListener("touchstart",function(e){
    justTouched=true;
    if(e.touches&&e.touches[0]){
      sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false;
    }
  },{passive:true});
  el.addEventListener("touchmove",function(e){
    if(e.touches&&e.touches[0] &&
       Math.hypot(e.touches[0].clientX-sx,e.touches[0].clientY-sy)>10)moved=true;
  },{passive:true});
  el.addEventListener("touchend",function(e){
    if(e.cancelable)e.preventDefault();
    if(!moved)fn();
    setTimeout(function(){justTouched=false;},450);
  },{passive:false});
  el.addEventListener("click",function(e){
    // Mobile browsers often synthesize a click after touchend.
    // Ignore that synthetic click so PLAY/START only fire once.
    if(justTouched)return;
    fn();
  });
}


var musicOn=true, audioCtx=null, musicGain=null, musicTimer=null, musicStep=0;
function startMusic(){
  if(!musicOn)return;
  try{
    if(!audioCtx){
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      musicGain=audioCtx.createGain();
      musicGain.gain.value=.12;
      musicGain.connect(audioCtx.destination);

      // Original in-game melody (not the copyrighted recording).
      var notes=[220,247,262,294,330,294,262,247,220,196,220,247,262,294,330,392,330,294];
      var bass=[110,123,131,147,165,147,131,123,110,98,110,123,131,147,165,196,165,147];

      musicTimer=setInterval(function(){
        if(!musicOn||!audioCtx||!musicGain)return;
        if(audioCtx.state==="suspended") audioCtx.resume();

        var now=audioCtx.currentTime;
        var n=notes[musicStep%notes.length];
        var b=bass[musicStep%bass.length];
        musicStep++;

        function tone(freq,volume,duration,type){
          var o=audioCtx.createOscillator();
          var g=audioCtx.createGain();
          o.type=type||"triangle";
          o.frequency.setValueAtTime(freq,now);
          g.gain.setValueAtTime(.0001,now);
          g.gain.exponentialRampToValueAtTime(volume,now+.025);
          g.gain.exponentialRampToValueAtTime(.0001,now+duration);
          o.connect(g); g.connect(musicGain);
          o.start(now); o.stop(now+duration+.02);
        }

        tone(n,.20,.34,"triangle");
        tone(b,.055,.42,"sine");
      },420);
    }

    // Always restore volume when turning music back on.
    musicGain.gain.value=.12;
    if(audioCtx.state==="suspended") audioCtx.resume();
  }catch(e){
    console.log("Music unavailable:",e);
  }
}
function toggleMusic(){
  musicOn=!musicOn;
  $("musicBtn").textContent=musicOn?"🔊 NHẠC":"🔇 TẮT NHẠC";
  if(musicOn){
    startMusic();
  }else if(musicGain){
    musicGain.gain.value=0;
  }
}

var selected=[];
var guyLevel=0;
var guyKills=0;
var guyTigerDamage=50;
var painLevel=0;
var painKills=0;
var painBlackHoleDamage=50;
var todorokiLevel=0;
var todorokiKills=0;
var powerLevel=0;
var powerKills=0;
var megumiLevel=0;
var megumiKills=0;
var grid=$("grid");

var SAVE_KEY="monster_battle_royale_save_v1";
function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({guyLevel:guyLevel,guyKills:guyKills,guyTigerDamage:guyTigerDamage,painLevel:painLevel,painKills:painKills,painBlackHoleDamage:painBlackHoleDamage,todorokiLevel:todorokiLevel,todorokiKills:todorokiKills,powerLevel:powerLevel,powerKills:powerKills,megumiLevel:megumiLevel,megumiKills:megumiKills}));}catch(e){}}
function loadGame(){try{var raw=localStorage.getItem(SAVE_KEY);if(!raw)return;var d=JSON.parse(raw);selected=[];if(Number.isFinite(d.guyLevel))guyLevel=Math.max(0,Math.min(8,d.guyLevel));if(Number.isFinite(d.guyKills))guyKills=Math.max(0,d.guyKills);if(Number.isFinite(d.guyTigerDamage))guyTigerDamage=Math.max(50,d.guyTigerDamage);if(Number.isFinite(d.painLevel))painLevel=Math.max(0,Math.min(5,d.painLevel));if(Number.isFinite(d.painKills))painKills=Math.max(0,d.painKills);if(Number.isFinite(d.painBlackHoleDamage))painBlackHoleDamage=Math.max(50,d.painBlackHoleDamage);if(Number.isFinite(d.todorokiLevel))todorokiLevel=Math.max(0,Math.min(10,d.todorokiLevel));if(Number.isFinite(d.todorokiKills))todorokiKills=Math.max(0,d.todorokiKills);if(Number.isFinite(d.powerLevel))powerLevel=Math.max(0,Math.min(5,d.powerLevel));if(Number.isFinite(d.powerKills))powerKills=Math.max(0,d.powerKills);if(Number.isFinite(d.megumiLevel))megumiLevel=Math.max(0,Math.min(25,d.megumiLevel));if(Number.isFinite(d.megumiKills))megumiKills=Math.max(0,d.megumiKills);}catch(e){}}
loadGame();
function guyNextRequirement(){ return guyLevel>=8 ? 0 : 5*(guyLevel+1); }
function updateGuyUpgrade(){
  var req=guyNextRequirement();
  var info=$("guyUpgradeInfoHome"), btn=$("upgradeGuyHome");
  if(guyLevel>=8){
    info.textContent="Trú Hổ: "+guyTigerDamage+" dame • Cấp 8/8 • Đã tối đa • Tổng kill: "+guyKills;
    btn.textContent="ĐÃ ĐẠT CẤP TỐI ĐA";
    btn.disabled=true;
  }else{
    info.textContent="Trú Hổ: "+guyTigerDamage+" dame • Cấp "+guyLevel+"/8 • Kill: "+guyKills+" / "+req;
    btn.textContent="NÂNG CẤP CẤP "+(guyLevel+1)+" • CẦN "+req+" KILL";
    btn.disabled=guyKills<req;
  }
}
MONSTERS.forEach(function(m,i){
  var b=document.createElement("button");
  b.className="card";
  b.innerHTML='<div class="emo">'+(m[0]==="Todoroki Shoto"?'<div class="todorokiHead"></div>':m[1])+'</div><div class="nm">'+m[0]+'</div><div class="st">HP '+m[2]+' • DMG '+m[3]+'<br>SPD '+m[4]+' • CD '+m[5]+'s</div>';
  tap(b,function(){
    var pos=selected.indexOf(i);
    if(pos>=0) selected.splice(pos,1);
    else if(selected.length<10) selected.push(i);
    b.classList.toggle("sel",selected.indexOf(i)>=0);
    $("counter").textContent="Đã chọn "+selected.length+" / 10";
    saveGame();
  });
  grid.appendChild(b);
});
updateGuyUpgrade();
function painNextRequirement(){ return painLevel>=5 ? 0 : 5*(painLevel+1); }
function todorokiNextRequirement(){ return todorokiLevel>=10 ? 0 : 5*(todorokiLevel+1); }
function updateTodorokiUpgrade(){
  var info=$("todorokiUpgradeInfoHome"),btn=$("upgradeTodorokiHome"); if(!info||!btn)return;
  var req=todorokiNextRequirement();
  if(todorokiLevel>=10){info.textContent="Bạo Hỏa Quyền + Đại Băng Hải Tảo • Cấp 10/10 • Đã tối đa • Tổng kill: "+todorokiKills;btn.textContent="ĐÃ ĐẠT CẤP TỐI ĐA";btn.disabled=true;}
  else{info.textContent="Băng/Hỏa • Cấp "+todorokiLevel+"/10 • Kill: "+todorokiKills+" / "+req;btn.textContent="NÂNG CẤP CẤP "+(todorokiLevel+1)+" • CẦN "+req+" KILL";btn.disabled=todorokiKills<req;}
}
function powerNextRequirement(){ return powerLevel>=5 ? 0 : 5*(powerLevel+1); }
function updatePowerUpgrade(){
  var info=$("powerUpgradeInfoHome"),btn=$("upgradePowerHome"); if(!info||!btn)return;
  var req=powerNextRequirement();
  if(powerLevel>=5){
    info.textContent="Vạn Kiếm Huyết Trận + hồi 100 HP khi hạ gục • Cấp 5/5 • Đã tối đa • Tổng kill: "+powerKills;
    btn.textContent="ĐÃ ĐẠT CẤP TỐI ĐA";btn.disabled=true;
  }else{
    info.textContent="Huyết Cự Phủ • Cấp "+powerLevel+"/5 • Kill: "+powerKills+" / "+req;
    btn.textContent="NÂNG CẤP CẤP "+(powerLevel+1)+" • CẦN "+req+" KILL";btn.disabled=powerKills<req;
  }
}
function updatePainUpgrade(){
  var req=painNextRequirement(), info=$("painUpgradeInfoHome"), btn=$("upgradePainHome");
  if(!info||!btn)return;
  if(painLevel>=5){
    info.textContent="Vạn Tượng Thiên Dẫn: "+painBlackHoleDamage+" dame nổ • Cấp 5/5 • Đã tối đa • Tổng kill: "+painKills;
    btn.textContent="ĐÃ ĐẠT CẤP TỐI ĐA"; btn.disabled=true;
  }else{
    info.textContent="Vạn Tượng Thiên Dẫn: "+painBlackHoleDamage+" dame nổ • Cấp "+painLevel+"/5 • Kill: "+painKills+" / "+req;
    btn.textContent="NÂNG CẤP CẤP "+(painLevel+1)+" • CẦN "+req+" KILL";
    btn.disabled=painKills<req;
  }
}
updatePainUpgrade();
updateTodorokiUpgrade();
updatePowerUpgrade();
tap($("upgradeMenuHome"),function(){
  var panel=$("upgradePanelHome");
  panel.style.display=panel.style.display==="none"?"block":"none";
  updateGuyUpgrade();
  updatePainUpgrade();
  updateTodorokiUpgrade();
  updatePowerUpgrade();
  updateMegumiUpgrade();
});
tap($("upgradePainHome"),function(){
  var req=painNextRequirement();
  if(painLevel<5 && painKills>=req){ painLevel++; painBlackHoleDamage+=10; updatePainUpgrade(); saveGame(); }
});
tap($("resetPainHome"),function(){if(confirm("Reset LV Pain về 0? Kill vẫn được giữ nguyên.")){painLevel=0;painBlackHoleDamage=50;updatePainUpgrade();saveGame();}});
tap($("upgradeGuyHome"),function(){
  var req=guyNextRequirement();
  if(guyLevel<8 && guyKills>=req){
    guyLevel++;
    guyTigerDamage+=10;
    updateGuyUpgrade();
    saveGame();
  }
});
tap($("resetGuyHome"),function(){if(confirm("Reset LV Might Guy về 0? Kill vẫn được giữ nguyên.")){guyLevel=0;guyTigerDamage=50;updateGuyUpgrade();saveGame();}});
tap($("upgradeTodorokiHome"),function(){
  var req=todorokiNextRequirement();
  if(todorokiLevel<10 && todorokiKills>=req){ todorokiLevel++; saveGame(); updateTodorokiUpgrade(); }
});
tap($("resetTodorokiHome"),function(){if(confirm("Reset LV Todoroki về 0? Kill vẫn được giữ nguyên.")){todorokiLevel=0;updateTodorokiUpgrade();saveGame();}});

tap($("upgradePowerHome"),function(){
  var req=powerNextRequirement();
  if(powerLevel<5 && powerKills>=req){ powerLevel++; saveGame(); updatePowerUpgrade(); }
});
tap($("resetPowerHome"),function(){if(confirm("Reset LV Power về 0? Kill vẫn được giữ nguyên.")){powerLevel=0;updatePowerUpgrade();saveGame();}});

function megumiNextRequirement(){ return megumiLevel>=25 ? 0 : 5*(megumiLevel+1); }
function updateMegumiUpgrade(){
  var info=$("megumiUpgradeInfoHome"),btn=$("upgradeMegumiHome"); if(!info||!btn)return;
  var req=megumiNextRequirement();
  if(megumiLevel>=25){info.textContent="Triệu hồi thức thần + Bành Trướng Lãnh Địa • Cấp 25/25 • Tổng kill: "+megumiKills;btn.textContent="ĐÃ ĐẠT CẤP TỐI ĐA";btn.disabled=true;}
  else{var bonus=Math.floor(megumiLevel/5)*5;info.textContent="8 Thức thần • +"+bonus+"% DMG • Cấp "+megumiLevel+"/25 • Kill: "+megumiKills+" / "+req;btn.textContent="NÂNG CẤP CẤP "+(megumiLevel+1)+" • CẦN "+req+" KILL";btn.disabled=megumiKills<req;}
}

function isSameNarutoTeam(a,b){
  if(!a||!b)return false;
  return (a.kind==="Naruto Kid" && b.owner===a) ||
         (b.kind==="Naruto Kid" && a.owner===b) ||
         (a.owner && a.owner===b.owner);
}
function canTarget(attacker,target){
  if(!target||!target.alive||target===attacker)return false;
  // Viên Lộc luôn không thể bị chọn làm mục tiêu.
  if(target.kind==="Vien Loc Clone")return false;
  // Thỏ không bao giờ tự chọn mục tiêu để tấn công.
  if(attacker.kind==="Megumi Shikigami" && attacker.type==="rabbit")return false;
  // Megumi không được target bất kỳ thức thần nào của chính mình.
  if(attacker.kind==="Megumi" && target.owner===attacker)return false;
  // Sói, Nue và Mãn Tượng là thức thần vật lý: phải được phép trở thành mục tiêu
  // của đòn đánh thường và collision như một nhân vật bình thường. Chỉ chặn nếu
  // người tấn công thuộc cùng Megumi.
  if(target.kind==="Megumi Shikigami" && (target.type==="dog"||target.type==="nue"||target.type==="elephant")){
    if(target.owner===attacker || (attacker.kind==="Megumi Shikigami" && attacker.owner===target.owner))return false;
    return true;
  }
  // Đại Xà và Oán Ngưu là thức thần dạng kỹ năng lao/đánh nhanh: không trở thành mục tiêu để
  // địch khóa đánh thường, tránh bị hạ ngay khi vừa xuất hiện.
  if(target.kind==="Megumi Shikigami" && (target.type==="snake"||target.type==="ox"))return false;
  // Các thức thần cùng một Megumi không được target lẫn nhau, và cũng không target Megumi chủ.
  if(attacker.kind==="Megumi Shikigami" && target.owner===attacker.owner)return false;
  if(target.kind==="Megumi Shikigami" && target.owner===attacker)return false;
  if(attacker.kind==="Megumi Shikigami" && target===attacker.owner)return false;
  if(target.kind==="Megumi Shikigami" && target.owner===attacker.owner)return false;
  if(isSameNarutoTeam(attacker,target))return false;
  return true;
}
function skillTargetFor(f){
  if(!f || (f.freezeTimer||0)>0 || (f.stunTimer||0)>0)return null;
  var t=null,best=Infinity;
  fighters.forEach(function(e){
    if(!canTarget(f,e))return;
    var d=Math.hypot(e.x-f.x,e.y-f.y);
    if(d<best){best=d;t=e;}
  });
  return t;
}
function beginSkill(f){
  if(!f.alive||f.skillTimer>0||f.skillBusy>0)return;
  if(f.kind!=="Luffy Kid"&&f.kind!=="Goku")return;
  var t=skillTargetFor(f);if(!t)return;
  f.skillTarget=t;f.skillDir=Math.atan2(t.y-f.y,t.x-f.x);
  f.skillBusy=f.kind==="Goku"?1.4:.48;f.skillTimer=f.kind==="Goku"?8:5;
  f.skillType=f.kind==="Goku"?"kame":"fist";f.kameHitTimer=0;f.vx=0;f.vy=0;
}
function tickSkill(f,dt){
  if(f.skillTimer>0)f.skillTimer=Math.max(0,f.skillTimer-dt);
  if(f.skillBusy<=0)return false;
  f.skillBusy=Math.max(0,f.skillBusy-dt);f.vx=0;f.vy=0;
  if(f.skillBusy<=0&&f.skillTarget&&f.skillTarget.alive){
    var t=f.skillTarget,dx=Math.cos(f.skillDir),dy=Math.sin(f.skillDir);
    if(f.skillType==="fist"){
      if(Math.hypot(t.x-f.x,t.y-f.y)<220 && canDamage(t)){t.hp-=f.dmg*2;t.flash=.16;applyKnockback(t,dx,dy,480);}
    }else{
      fighters.forEach(function(e){
        if(!e.alive||e===f||e.owner===f)return;
        var ex=e.x-f.x,ey=e.y-f.y,along=ex*dx+ey*dy,side=Math.abs(ex*dy-ey*dx);

          fighters.forEach(function(e){if(!e.alive||e===f||e.owner===f)return; if(!canDamage(e))return; e.hp-=180;e.flash=.35;applyStun(e,2.5);var dx=e.x-f.x,dy=e.y-f.y,d=Math.hypot(dx,dy)||1;applyKnockback(e,dx/d,dy/d,900);if(e.hp<=0){e.hp=0;e.alive=false;f.kills++;kos++;todorokiKills++;updateTodorokiUpgrade();saveGame();}});
          f.skillFlash=1;f.skillPulse=1;showSkillText("🔥❄️ BẠO NỔ SÓNG NHIỆT — CHOÁNG!");

      }else{

            showSkillText("🔥 TỤ LỰC 2s — BẠO HỎA QUYỀN!");
          }else if(f.todorokiBlueReady && !f.todorokiBlueSkillUsed && (f.todorokiLevelForBattle||0)>=10){
            useTodorokiIceUltimate(f);
          }
        }
        // Only after BOTH full meters have each spent their corresponding skill,

        if(f.todorokiUltimateCharge<=0 && f.todorokiFireCharge<=0 && !f.todorokiFire && !f.todorokiIce && !f.todorokiRedSkill && !f.todorokiBlueSkill &&
           f.todorokiRedReady && f.todorokiBlueReady && f.todorokiRedSkillUsed && f.todorokiBlueSkillUsed &&
           (f.todorokiLevelForBattle||0)>=10 && f.hp/f.max<.50 && !f.todorokiUltimateUsed){

        if(f.todorokiCD<=0 && f.todorokiUltimateCharge<=0 && !f.todorokiRedSkill && !f.todorokiBlueSkill){
          var tt=skillTargetFor(f);
          if(tt){
            var tdx=tt.x-f.x,tdy=tt.y-f.y,td=Math.hypot(tdx,tdy)||1,dir=Math.atan2(tdy,tdx);

          if(ic.hit||ic.life<=0||ic.x<-150||ic.x>WORLD_W+150||ic.y<-150||ic.y>WORLD_H+150){f.todorokiIce=null;f.vx=0;f.vy=0;}

          if(fr.life<=0)f.todorokiFire=null;

    // Tatsumaki: Bão Đá Càn Quét — 1-5 rocks; 10% chance to cast the separate Thiên Thạch Tâm Linh skill instead.
    if(f.kind==="Tatsumaki" && !f.owner){
      f.tatsuCD=Math.max(0,f.tatsuCD-dt);

    // Power: Huyết Cự Phủ. Randomly uses hammer or horizontal blood scythe.

      if(f.powerCD<=0 && !f.powerSkill && (f.freezeTimer||0)<=0 && (f.stunTimer||0)<=0){
        if((f.powerLevelForBattle||0)>=5 && f.hp<=f.max*0.5) usePowerUltimate(f); else usePowerSkill(f);

    // Zenitsu: Thunderclap and Flash. 3s charge, then a fast sword dash through the target.
if(f.kind==="Zenitsu" && !f.owner){
      f.zenitsuCD=Math.max(0,f.zenitsuCD-dt);

        f.zenitsuTrail.push({x:f.x,y:f.y,life:.34});
        if(f.zenitsuTrail.length>18)f.zenitsuTrail.shift();

        // Slash through an opponent, not stopping on contact.
        fighters.forEach(function(e){
          if(f.zenitsuHit||!e.alive||e===f||e.owner===f)return;
          var ex=e.x-f.x,ey=e.y-f.y;

          if(Math.abs(along)<48 && side<42 && canDamage(e)){

      } else if(f.zenitsuCD<=0){

    if(f.kind==="Zenitsu" && !f.owner && f.zenitsuDash<=0 && f.zenitsuCharge<=0 && f.zenitsuCD<=0){

    if(f.kind==="Zenitsu" && !f.owner && (f.zenitsuCharge>0 || f.zenitsuDash>0)){

    } else if(f.hitLock<=0 && (f.freezeTimer||0)<=0 && f.kind!=="Vien Loc Clone" && f.kind!=="Megumi Shikigami" && !(f.kind==="Might Guy" && !f.owner && f.guyTiger && f.guyTiger.redLunge) && !(f.kind==="Pain" && !f.owner && f.painUltimateCharge>0) && !(f.kind==="Kusakabe Atsuya" && !f.owner && f.kusaDomain) && !(f.kind==="Todoroki Shoto" && !f.owner && (f.todorokiUltimateCharge>0 || f.todorokiFireCharge>0)) && !(f.kind==="Power" && !f.owner && f.powerSkill)){
      var target=null,best=Infinity;

    f.x+=f.vx*dt;f.y+=f.vy*dt;
    f.x=Math.max(f.r+12,Math.min(WORLD_W-f.r-12,f.x));
    f.y=Math.max(80+f.r,Math.min(WORLD_H-f.r-12,f.y));
  });

  // Physical collision: dùng NGUYÊN CƠ CHẾ VA CHẠM GỐC CỦA NHÂN VẬT.
  // Sói, Nue và Mãn Tượng được đưa vào cùng hệ thống; Đại Xà/Oán Ngưu
  // không tham gia collision vì chúng là thức thần dạng kỹ năng.
  function isPhysicalShikigami(f){
    return !!f && f.kind==="Megumi Shikigami" && (f.type==="dog"||f.type==="nue"||f.type==="elephant");

  for(var i=0;i<fighters.length;i++)for(var j=i+1;j<fighters.length;j++){

    var dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,min=a.r+b.r+2;
    if(d<min){
      var nx=dx/d,ny=dy/d,o=min-d;
      var aLocked=(a.stunTimer||0)>0 || (a.freezeTimer||0)>0;
      var bLocked=(b.stunTimer||0)>0 || (b.freezeTimer||0)>0;
      if(!aLocked&&!bLocked){

      }else if(!bLocked){
        b.x+=nx*o;b.y+=ny*o;
        applyKnockback(b,nx,ny,120);

      var sameNarutoTeam = (a.owner&&a.owner===b.owner) ||

      if(!sameNarutoTeam && a.timer<=0 && a.hitLock<=0 && (a.freezeTimer||0)<=0 && (b.freezeTimer||0)<=0)damage(a,b,nx,ny);
      if(!sameNarutoTeam && b.timer<=0 && b.hitLock<=0 && b.alive && (b.freezeTimer||0)<=0 && (a.freezeTimer||0)<=0)damage(b,a,-nx,-ny);

  // Viên Lộc: if Megumi dies while the deer is still active, revive Megumi once at 20% HP.
  fighters.forEach(function(f){

  // Chỉ các chiến binh thật mới quyết định kết thúc trận. Thức thần của Megumi

  battleAlive=fighters.filter(function(f){
    return f.alive && f.kind!=="Megumi Shikigami" && f.kind!=="Vien Loc Clone" && !f.owner;
  });
  if(battleAlive.length<=1){
    running=false;var w=battleAlive[0];

}

function spawnClone(owner,side){
  var ang=Math.atan2(owner.vy,owner.vx)||0;
  var px=owner.x+Math.cos(ang+side*.8)*42;
  var py=owner.y+Math.sin(ang+side*.8)*42;
  fighters.push({
    name:"Shadow Clone",icon:"🍥",max:55,hp:55,dmg:10,spd:owner.spd*1.03,cd:1.2,
    timer:.2,skillTimer:0,x:px,y:py,vx:0,vy:0,alive:true,kills:0,r:18,flash:0,
    kind:"Clone",owner:owner,hitLock:.2,skillFlash:.75,skillPulse:.75,life:7
  });
}


function fireGojoPurple(f){
  // Create a real purple projectile that travels forward instead of drawing
  // a beam directly from Gojo.
  var dx=Math.cos(f.gojoDir),dy=Math.sin(f.gojoDir);
  f.gojoProjectile={
    x:f.x+dx*48,y:f.y+dy*48,
    vx:dx*620,vy:dy*620,
    life:0.75,r:27
  };
  f.gojoFire=0.75;
  f.skillFlash=.65;
  f.skillPulse=.65;
}

function tickGojoProjectile(f,dt){
  var p=f.gojoProjectile;
  if(!p)return;
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;

  fighters.forEach(function(e){
    if(!e.alive||e===f||e.owner===f||p.hit)return;
    if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+p.r){
      if(canDamage(e))e.hp-=f.dmg*5.2;
      e.flash=.28;
      applyKnockback(e,p.vx/(Math.hypot(p.vx,p.vy)||1),p.vy/(Math.hypot(p.vx,p.vy)||1),Math.hypot(p.vx,p.vy)*.8);
      p.hit=true;
      if(e.hp<=0){e.hp=0;e.alive=false;f.kills++;kos++;}
    }
  });

  if(p.hit||p.life<=0||p.x<-80||p.x>WORLD_W+80||p.y<-80||p.y>WORLD_H+80){
    f.gojoProjectile=null;
    f.gojoFire=0;
  }
}


function useTatsumakiSkill(f){
  var targets=fighters.filter(function(e){return e.alive&&e!==f&&e.owner!==f&&canTarget(f,e);});
  if(!targets.length)return false;

  // 10%: tung hẳn skill Thiên Thạch Tâm Linh, không tạo đá.
  if(Math.random()<0.10){
    var mt=targets[Math.floor(Math.random()*targets.length)];
    f.tatsuStorm={rocks:[],meteor:{x:mt.x,y:-70,targetX:mt.x,targetY:mt.y,r:25,life:1.45,hit:false,vy:680},life:1.5,meteorOnly:true};
    f.tatsuCD=6;f.skillFlash=1;f.skillPulse=1;
    showSkillText("☄️ THIÊN THẠCH TÂM LINH!");
    return true;
  }

  // Đá xuất hiện quanh chính Tatsumaki trước, đứng yên một nhịp rồi mới phóng.
  var count=1+Math.floor(Math.random()*5), rocks=[];
  for(var i=0;i<count;i++){
    var a=(Math.PI*2/count)*i+(Math.random()-.5)*.45;
    var rr=46+Math.random()*24;
    rocks.push({x:f.x+Math.cos(a)*rr,y:f.y+Math.sin(a)*rr,
      vx:0,vy:0,target:null,life:2.15,r:11+Math.random()*3,hit:false,spin:Math.random()*6.28,
      ox:Math.cos(a)*rr,oy:Math.sin(a)*rr,launchDelay:.28,launched:false});
  }
  f.tatsuStorm={rocks:rocks,meteor:null,life:2.45,meteorOnly:false,launchReady:.28};
  f.tatsuCD=6;f.skillFlash=1;f.skillPulse=1;
  showSkillText("🌀🪨 BÃO ĐÁ CÀN QUÉT!");
  return true;
}
function tickTatsumakiSkill(f,dt){
  var s=f.tatsuStorm;if(!s)return;
  s.life-=dt;
  var targets=fighters.filter(function(e){return e.alive&&e!==f&&e.owner!==f&&canTarget(f,e);});
  var launchedAny=false;

  s.rocks.forEach(function(r){
    if(r.hit)return;
    r.life-=dt;
    if(!r.launched){
      // Đá chỉ đứng quanh Tatsumaki; chưa được tính dame/va chạm.
      r.x=f.x+r.ox; r.y=f.y+r.oy;
      r.launchDelay-=dt;
      if(r.launchDelay<=0){
        if(targets.length){
          var t=targets[Math.floor(Math.random()*targets.length)];
          r.target=t;
          var dx=t.x-r.x,dy=t.y-r.y,d=Math.sqrt(dx*dx+dy*dy)||1,speed=470+Math.random()*90;
          r.vx=dx/d*speed;r.vy=dy/d*speed;
        }else{r.vx=0;r.vy=0;}
        r.launched=true;launchedAny=true;
      }
      return;
    }

// Megumi hoặc kẻ địch, vì collision ở frame đầu có thể đẩy cả cụm ra xa.
function megumiSafeSpawn(f,x,y,r){
  var pts=[{x:x,y:y}];
  for(var k=0;k<16;k++){
    var a=k*Math.PI*2/16;
    pts.push({x:f.x+Math.cos(a)*Math.max(82,r+f.r+42),y:f.y+Math.sin(a)*Math.max(82,r+f.r+42)});
  }
  var best=pts[0],bestScore=-Infinity;
  for(var i=0;i<pts.length;i++){
    var px=Math.max(r+18,Math.min(WORLD_W-r-18,pts[i].x));
    var py=Math.max(80+r,Math.min(WORLD_H-r-18,pts[i].y));
    var score=Math.hypot(px-f.x,py-f.y);
    for(var j=0;j<fighters.length;j++){
      var e=fighters[j];
      if(!e.alive||e===f||e.owner===f||e.kind==="Vien Loc Clone")continue;
      score=Math.min(score,Math.hypot(px-e.x,py-e.y)-r-e.r);
    }
    if(score>bestScore){bestScore=score;best={x:px,y:py};}
  }
  return best;
}

          var ex=e.x-ox0,ey=e.y-oy0,dxs=s.x-ox0,dys=s.y-oy0,seg=dxs*dxs+dys*dys||1;

function tickMahoraga(m,dt){
  // Mahoraga giờ là một nhân vật thực sự: tự tìm mục tiêu, chạy tới và đánh khi áp sát.

  if(t&&t.alive){
    var dx=t.x-m.x,dy=t.y-m.y,d=Math.hypot(dx,dy)||1;
    var attackRange=t.r+m.r+8;
    var speed=210;
    if(d>attackRange){
      var wantX=dx/d*speed,wantY=dy/d*speed;
      m.vx+=(wantX-(m.vx||0))*Math.min(1,dt*6);
      m.vy+=(wantY-(m.vy||0))*Math.min(1,dt*6);
      m.x+=(m.vx||0)*dt;m.y+=(m.vy||0)*dt;
    }else{
      m.vx*=Math.pow(.08,dt);m.vy*=Math.pow(.08,dt);
      m.x+=(m.vx||0)*dt;m.y+=(m.vy||0)*dt;
      if(m.mahoAttackCD<=0){
        t.hp-=100;t.flash=.12;m.mahoAttackCD=1;
        if(t.hp<=0){t.hp=0;t.alive=false;megumiKill(m,t);}
      }
    }
  }else{
    m.vx*=Math.pow(.08,dt);m.vy*=Math.pow(.08,dt);
    m.x+=(m.vx||0)*dt;m.y+=(m.vy||0)*dt;
  }
  m.x=Math.max(m.r+12,Math.min(WORLD_W-m.r-12,m.x));
  m.y=Math.max(80+m.r,Math.min(WORLD_H-m.r-12,m.y));
  m.mahoWheel=(m.mahoWheel+dt*2)%(Math.PI*2);
}

function drawElephantWave(ctx,s,r){
  // Mãn Tượng: tường nước phải xuất phát NGAY TẠI CON VOI.
  // Hàm này được gọi sau khi canvas đã translate tới vị trí của voi,
  // nên tuyệt đối KHÔNG translate(s.x,s.y) lần nữa.
  if(!s || (s.waveLife||0)<=0)return;
  var prog=Math.max(0,Math.min(1,s.waveProgress||0));
  var dx=s.dirX||0,dy=s.dirY||-1;
  var ang=Math.atan2(dy,dx);
  var length=18+prog*250;
  var wallH=78;
  var fade=1-prog*.22;

  ctx.save();
  ctx.rotate(ang);
  ctx.globalAlpha=fade;

  // Bắt đầu từ mép voi và nối liền ra phía trước.
  var sx=Math.max(0,r-1);
  var ex=sx+length;

  // Thân tường nước: không có phần nào xuất hiện ở một vị trí khác.
  ctx.fillStyle="#20bdf3";
  ctx.strokeStyle="#dffaff";
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(sx,-wallH*.48);
  ctx.quadraticCurveTo(sx+length*.18,-wallH*.62,sx+length*.48,-wallH*.55);
  ctx.quadraticCurveTo(sx+length*.78,-wallH*.48,ex,-wallH*.34);
  ctx.lineTo(ex,wallH*.34);
  ctx.quadraticCurveTo(sx+length*.78,wallH*.48,sx+length*.48,wallH*.55);
  ctx.quadraticCurveTo(sx+length*.18,wallH*.62,sx,wallH*.48);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Bọt nước ngay tại miệng phun của voi.
  ctx.fillStyle="#8cecff";
  ctx.beginPath();
  ctx.arc(sx+5,-25,7,0,Math.PI*2);
  ctx.arc(sx+8,25,6,0,Math.PI*2);
  ctx.arc(sx+16,-4,5,0,Math.PI*2);
  ctx.fill();

  // Vệt trắng chạy xuyên suốt từ voi đến đầu tường.
  ctx.strokeStyle="#ffffff";
  ctx.lineWidth=5;
  ctx.beginPath();
  ctx.moveTo(sx+4,-18);
  ctx.quadraticCurveTo(sx+length*.45,-30,ex-10,-15);
  ctx.moveTo(sx+4,18);
  ctx.quadraticCurveTo(sx+length*.45,30,ex-10,15);
  ctx.stroke();

  // Mặt tường ở đầu sóng.
  ctx.fillStyle="#52d8ff";
  ctx.beginPath();
  ctx.arc(ex,0,wallH*.43,Math.PI*.5,Math.PI*1.5);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.restore();
}

function tickPainBlackHole(f,dt){

  h.life-=dt;h.pulse+=dt;

  var pullRange2=48400,hardRange2=3025;
  fighters.forEach(function(e){
    if(!e.alive||e===f||e.owner===f)return;
    var dx=hx-e.x,dy=hy-e.y,d2=dx*dx+dy*dy;

    var d=Math.sqrt(d2)||1;
    var pull=(d<70?520:300)*(1-d/260);
    var force=pull*dt*2/d;
    e.vx+=dx*force;
    e.vy+=dy*force;
    if(d2<hardRange2){
      var move=Math.min(10,d);
      e.x+=dx/d*move;
      e.y+=dy/d*move;
    }
  });
  if(h.life<=0){
    fighters.forEach(function(e){
      if(!e.alive||e===f||e.owner===f)return;
      var dx=e.x-hx,dy=e.y-hy,d2=dx*dx+dy*dy;
      if(d2<15625){
        var d=Math.sqrt(d2)||1;
        if(canDamage(e))if(canDamage(e))e.hp-=h.damage;e.flash=.25;
        applyKnockback(e,dx/d,dy/d,650);

function drawPainBlackHole(h){

function painWhiteAura(f){

  ctx.save();

  var p=1-Math.max(0,Math.min(1,f.painUltimateCharge/2.5));

    );

  }

  // 12 directional pressure blades near Pain.
  for(var k=0;k<12;k++){
    var ka=k*Math.PI/6+now*.9;

    ctx.lineTo(f.x+Math.cos(ka)*rr2,f.y+Math.sin(ka)*rr2);
    ctx.stroke();
  }
  ctx.restore();
}
function guyDamageMultiplier(f){
  if(!f || f.kind!=="Might Guy") return 1;
  var lvl=f.guyLevelForBattle||0;
  var ratio=f.hp/f.max;

  // Lv0: từ đầu đến cuối không có khí và không tăng damage.
  if(lvl<=0) return 1;

  // Lv1-5: chỉ có mốc 90% HP.
  if(lvl<=5) return ratio<=.90 ? 1.10 : 1;

  // Lv6: 90% +10%, 70% chuyển khí xanh lá +20%.
  if(lvl===6){
    if(ratio<=.70) return 1.20;
    if(ratio<=.90) return 1.10;
    return 1;
  }

  // Lv7: 90% +10%, 70% +20%, 50% chuyển khí xanh lam +30%.
  if(lvl===7){
    if(ratio<=.50) return 1.30;
    if(ratio<=.70) return 1.20;
    if(ratio<=.90) return 1.10;
    return 1;
  }

  // Lv8: thêm mốc 30% -> khí đỏ +50%.
  if(ratio<=.30) return 1.50;
  if(ratio<=.50) return 1.30;
  if(ratio<=.70) return 1.20;
  if(ratio<=.90) return 1.10;
  return 1;
}
function canDamage(vic){
  if(!vic||!vic.alive||vic.kind==="Vien Loc Clone")return false;
  if(vic.kind==="Megumi Shikigami" && (vic.type==="frog"||vic.type==="rabbit"||vic.type==="deer"||vic.type==="ox"||vic.type==="snake"))return false;
  // Sói, Nue và Mãn Tượng nhận damage bình thường từ mọi đòn đánh hợp lệ.
  if(vic.kind==="Megumi Shikigami" && (vic.type==="dog"||vic.type==="nue"||vic.type==="elephant"))return true;
  return !((vic.kind==="Todoroki Shoto") && !vic.owner && (vic.todorokiUltimateCharge||0)>0);
}
function canDamageTodoroki(vic){return !!vic && vic.alive;}
function isTatsumakiShield(v){return !!v && v.alive && v.kind==="Tatsumaki" && !v.owner && v.tatsuShield!==false;}
function applyKnockback(v,nx,ny,force){
  if(!v)return false;
  if(isTatsumakiShield(v) && Math.random()<0.10){
    v.skillPulse=Math.max(v.skillPulse||0,.35);
    return true;
  }
  v.vx+=nx*force;v.vy+=ny*force;
  return false;
}
function applyStun(v,duration){
  if(!v)return false;
  if(isTatsumakiShield(v)){
    v.skillPulse=Math.max(v.skillPulse||0,.45);
    return true;
  }
  v.stunTimer=Math.max(v.stunTimer||0,duration);
  v.stunFx=Math.max(v.stunFx||0,duration);

}
function damage(att,vic,nx,ny){
  if(vic&&vic.kind==="Vien Loc Clone")return;
